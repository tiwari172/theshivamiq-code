        if (html != null) e.innerHTML = html;
        if (css) Object.assign(e.style, css);
        if (parent) parent.appendChild(e);
        return e;

      let seed = 7;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

      gsap.defaults({ immediateRender: false });
      const root = gsap.timeline({ paused: true });
      const tl = gsap.timeline();

      // hook clip -> 0.2s black -> cartoon
      root.fromTo("#story", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, OFF);

      tl.fromTo("#bg", { scale: 1 }, { scale: 1.12, duration: END, ease: "none" }, 0);

      // ---------- characters ----------
      SCENES.filter((s) => !s.skip).forEach((sc, i) => {
        const w = el("div", "char", null, $("chars"));
        w.style.bottom = sc.bottom + "px";
        w.style.transformOrigin = "50% 100%";
        const inner = el("div", "in", null, w);
        inner.style.transformOrigin = "50% 70%";
        const im = el("img", null, null, inner);
        im.src = "assets/" + sc.img + ".png";
        if (sc.w) im.style.width = sc.w + "px"; else im.style.height = sc.h + "px";
        const d = sc.e - sc.s;
        const enters = {
          none: [{ opacity: 1 }, { opacity: 1, duration: 0.01 }],
          fade: [{ opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }],
          pop: [{ opacity: 0, scale: 0.55, y: 60 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.8)" }],
          rise: [{ opacity: 0, y: 420 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }],
          drop: [{ opacity: 0, y: -160, rotation: -4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "bounce.out" }],
          left: [{ opacity: 0, x: -900, skewX: 14 }, { opacity: 1, x: 0, skewX: 0, duration: 0.42, ease: "power4.out" }],
          right: [{ opacity: 0, x: 900, skewX: -14 }, { opacity: 1, x: 0, skewX: 0, duration: 0.42, ease: "power4.out" }],

        const [from, to] = enters[sc.enter];
        tl.fromTo(w, from, to, sc.s);
        if (sc.push) tl.fromTo(inner, { scale: 1 }, { scale: sc.push, duration: d, ease: "power1.inOut" }, sc.s);

        const c = el("div", "chip", (icon === "clock" ? clockSvg : "") + "<span>" + txt + "</span>", hdr());
        tl.fromTo(c, { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, s);
        fadeOut(c, e);
      });
      T.stamps.forEach(([txt, s, e, rot]) => {
        const st = el("div", "stamp", txt, hdr());
        stampIn(st, s, rot);
        fadeOut(st, e);
      });

      // ---------- crime scene: template B "Khoon ki Boondein" ----------
      {
        const [t0, t1] = T.crime;
        const fx = $("crime");
        const tag = el("div", "redtag", "CRIME SCENE", hdr());
        tl.fromTo(tag, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t0 + 0.05);
        fadeOut(tag, t1);
        const txt = "CRIME SCENE &#9679; DO NOT CROSS &#9679; ".repeat(4);
        const tp1 = el("div", "tape", txt, $("tapes"), { top: "770px" });
        const tp2 = el("div", "tape", txt, $("tapes"), { top: "1690px" });
        tl.fromTo(tp1, { opacity: 1, x: -1500, rotation: -9 }, { x: 0, rotation: -9, duration: 0.4, ease: "power3.out" }, t0 + 0.1);
        tl.fromTo(tp2, { opacity: 1, x: 1500, rotation: 7 }, { x: 0, rotation: 7, duration: 0.4, ease: "power3.out" }, t0 + 0.25);
        tl.to([tp1, tp2], { opacity: 0, duration: 0.15 }, t1 - 0.15);
        const grp = el("div", "layer", null, fx);
        const band = el("div", "mult", null, grp, { position: "absolute", left: 0, right: 0, top: 0, height: "0px", background: "#a50d14" });
        tl.to(band, { height: "70px", duration: 0.4, ease: "power2.out" }, t0 + 0.1);
        for (let i = 0; i < 11; i++) {
          const w = 26 + rnd() * 34;
          const d = el("div", "drip mult", null, grp, { left: Math.round(i * 100 + rnd() * 50) + "px", width: w + "px" });
          tl.to(d, { height: Math.round(500 + rnd() * 1500) + "px", duration: 1.4 + rnd() * 1.2, ease: "power1.in" }, t0 + 0.2 + rnd() * 0.5);
        }
        const curtain = el("div", "layer mult", null, grp, { background: "linear-gradient(180deg, #b3121a 0%, #b3121a 80%, rgba(179,18,26,0) 100%)", opacity: 0.6, clipPath: "inset(0 0 100% 0)" });
        tl.to(curtain, { clipPath: "inset(0 0 0% 0)", duration: 1.6, ease: "power1.inOut" }, t0 + 1.2);
        tl.to(grp, { opacity: 0, duration: 0.25 }, t1 - 0.2);
      }

      // suspects: badge + name plate (+ yellow wipe)
      T.suspects.forEach(([b, name, s, e], k) => {
        const dir = k % 2 ? 1 : -1;
        const bd = el("div", "badge", b, hdr());
        tl.fromTo(bd, { opacity: 0, y: -140, rotation: dir * 8 }, { opacity: 1, y: 0, rotation: dir * -2, duration: 0.45, ease: "back.out(2)" }, s + 0.1);
        fadeOut(bd, e);
        const np = el("div", "nameplate", null, $("hdrs"));
        const sp = el("span", null, name, np);
        tl.fromTo(sp, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, s + 0.3);
        fadeOut(sp, e);
        tl.fromTo("#wipe", { x: 0 }, { x: 2800, duration: 0.36, ease: "power2.inOut" }, s - 0.18);
      });

      n = el("div", "badge", "DHYAAN DO!", hdr());
      tl.fromTo(n, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.5)" }, T.dhyaan[0]);
      tl.to(n, { scale: 1.1, duration: 0.3, yoyo: true, repeat: 7, ease: "sine.inOut" }, T.dhyaan[0] + 0.4);
      fadeOut(n, T.dhyaan[1]);

      n = el("div", "stamp", "CASE SOLVED", hdr());
      n.style.fontSize = "84px";
      stampIn(n, T.solved[0], -7);
      fadeOut(n, T.solved[1]);

      n = el("div", "bigtitle", T.options[2], hdr());
      n.style.fontSize = "112px";
      stampIn(n, T.options[0] + 0.05, 0);
      fadeOut(n, T.options[1]);
      tl.fromTo("#cta span", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, T.ctaPill);
      tl.to("#cta span", { scale: 1.08, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, T.ctaPill + 0.4);
      tl.to("#cta span", { opacity: 0, duration: 0.15 }, T.options[1] - 0.15);

      n = el("div", null, null, hdr());
      n.id = "brand";
      n.innerHTML = '<img src="assets/LOGO_ROUND.png" alt="" /><span>@theshivamiq</span>';
      tl.fromTo(n, { opacity: 0, y: -80 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, T.brand);

      // ---------- night / blackout ----------
      T.night.forEach(([s, e, o]) => {
        tl.to("#night", { opacity: o, duration: 0.4 }, s);
        tl.to("#night", { opacity: 0, duration: 0.4 }, e - 0.4);
      });
      T.black.forEach(([s, e]) => {
        tl.to("#black", { opacity: 1, duration: 0.12, ease: "steps(3)" }, s);
        tl.to("#black", { opacity: 0, duration: 0.1 }, e);
      });
      if (T.relight != null) tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.5, ease: "power2.out" }, T.relight);

      // ---------- Shivam soch: stopwatch 3 sec ----------
      {
        const S = T.soch;
        const ticks = $("ticks");
        for (let k = 0; k < 12; k++) {
          const a = (k * 30 * Math.PI) / 180;
          const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
          ln.setAttribute("x1", 125 + Math.sin(a) * 96); ln.setAttribute("y1", 160 - Math.cos(a) * 96);
          ln.setAttribute("x2", 125 + Math.sin(a) * 84); ln.setAttribute("y2", 160 - Math.cos(a) * 84);
          ln.setAttribute("stroke", "#111"); ln.setAttribute("stroke-width", "5");
          ticks.appendChild(ln);
        }
        tl.fromTo("#watch", { opacity: 0, scale: 0.3, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2)" }, S);
        tl.fromTo("#ring", { attr: { "stroke-dashoffset": 553 } }, { attr: { "stroke-dashoffset": 0 }, duration: 3, ease: "none" }, S);
        gsap.set("#hand", { svgOrigin: "125 160" });
        for (let k = 1; k <= 15; k++) tl.to("#hand", { rotation: k * 24, duration: 0.05, ease: "power4.out" }, S + k * 0.2 - 0.05);
        tl.set("#count", { textContent: "3" }, S);
        tl.set("#count", { textContent: "2" }, S + 1);
        tl.set("#count", { textContent: "1" }, S + 2);
        for (const t of [S + 1, S + 2]) tl.fromTo("#watch", { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "power2.out" }, t);
        tl.to("#watch", { opacity: 0, scale: 0.6, duration: 0.15 }, S + 2.85);
        tl.to("#dimvig", { opacity: 1, duration: 0.4 }, S);
        tl.to("#dimvig", { opacity: 0, duration: 0.15 }, S + 2.85);
        const soch = $("sochtxt");
        "Shivam SOCH raha hai...".split("").forEach((c, k) => {
          if (c === " ") { soch.appendChild(document.createTextNode(" ")); return; }
          const sp = el("span", null, c, soch);
          tl.fromTo(sp, { opacity: 0 }, { opacity: 1, duration: 0.01 }, S + 0.58 + k * 0.045);
        });
        tl.to(soch, { opacity: 0, duration: 0.15 }, S + 2.85);
        tl.fromTo("#flash", { opacity: 0.9 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, S + 3);
      }

      root.add(tl, OFF);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = root;
    </script>
  </body>
</html>
