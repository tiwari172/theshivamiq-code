<html lang="en" data-resolution="portrait">
  <head>

    <meta name="viewport" content="width=1080, height=1920" />
    <title>H09-001 Naam ka Aadmi - HF</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>

        font-family: "ShivBlack";
        src: url("assets/fonts/ariblk.ttf") format("truetype");
      }

      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden; background: #000;
        font-family: "ShivBlack", sans-serif; color: #fff;
      }
      #hook { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #story { position: absolute; inset: 0; opacity: 0; overflow: hidden; background: #f6ecd6; }
      .layer { position: absolute; inset: 0; }
      .mult { mix-blend-mode: multiply; }
      #cam { position: absolute; inset: 0; transform-origin: 50% 55%; }
      #bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      #black { background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0.86), rgba(0,0,0,0.97)); opacity: 0; }
      #dimvig { background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.6) 100%); opacity: 0; }
      .drip { position: absolute; top: 0; background: #a50d14; border-radius: 0 0 40px 40px; height: 0; }

      .char { position: absolute; left: 0; right: 0; display: flex; justify-content: center; align-items: flex-end; opacity: 0; }
      .char .in { display: block; }
      .char img { display: block; filter: drop-shadow(0 18px 22px rgba(0,0,0,0.28)); }

      .hdr { position: absolute; left: 0; right: 0; top: 120px; height: 200px; display: flex;
        align-items: center; justify-content: center; gap: 36px; }
      .hdr > * { opacity: 0; }
      .bigtitle { font-size: 116px; line-height: 1; color: #ffd600; letter-spacing: 2px;
        -webkit-text-stroke: 14px #111; paint-order: stroke fill; text-shadow: 0 10px 0 rgba(0,0,0,0.25); }
      .badge { font-size: 64px; color: #111; background: #ffd600; padding: 10px 34px 14px; border-radius: 18px;
        border: 6px solid #111; box-shadow: 0 10px 0 #111; }
      .chip { display: flex; align-items: center; gap: 18px; font-size: 54px; color: #ffd600; background: #101a3c;
        padding: 14px 32px 16px; border-radius: 60px; border: 5px solid #ffd600; }
      .stamp { font-size: 70px; color: #e3171b; padding: 8px 26px 12px; border: 9px double #e3171b; border-radius: 14px;
        background: #fff8e8; letter-spacing: 3px; }
      .redtag { font-size: 78px; color: #fff; background: #e3171b; padding: 8px 34px 14px; border-radius: 14px;
        border: 6px solid #111; box-shadow: 0 10px 0 #111; }
      .nameplate { position: absolute; left: 0; right: 0; top: 1770px; display: flex; justify-content: center; }
      .nameplate span { opacity: 0; font-size: 70px; color: #fff; background: #111; padding: 6px 40px 12px; border-radius: 12px;
        border-bottom: 10px solid #ffd600; }

      .cap { position: absolute; left: 60px; right: 60px; top: 330px; height: 300px; display: flex; flex-wrap: wrap;
        align-content: center; justify-content: center; column-gap: 22px; row-gap: 6px; }
      .w { display: block; opacity: 0; }
      .wi { display: block; font-size: 84px; line-height: 1.15; padding: 2px 14px 10px; border-radius: 16px;
        color: #fff; -webkit-text-stroke: 12px #111; paint-order: stroke fill; }

      .tape { position: absolute; left: -200px; width: 1480px; height: 96px; background: #ffd600; border-top: 8px solid #111;
        border-bottom: 8px solid #111; display: flex; align-items: center; overflow: hidden; white-space: nowrap;
        font-size: 50px; color: #111; letter-spacing: 3px; opacity: 0; }

      #watch { position: absolute; left: 0; right: 0; top: 70px; display: flex; justify-content: center; opacity: 0; }
      #sochtxt { position: absolute; left: 60px; right: 60px; top: 420px; text-align: center; font-size: 92px; color: #ffd600;
        -webkit-text-stroke: 13px #111; paint-order: stroke fill; line-height: 1.12; }
      #sochtxt span { opacity: 0; }

      #cta { position: absolute; left: 0; right: 0; top: 1630px; display: flex; justify-content: center; }
      #cta span { opacity: 0; font-size: 60px; color: #111; background: #ffd600; padding: 12px 36px 16px; border-radius: 50px;
        border: 6px solid #111; box-shadow: 0 9px 0 #111; }
      #brand { display: flex; align-items: center; gap: 26px; }
      #brand img { width: 170px; height: 170px; }
      #brand span { font-size: 68px; color: #111; }

      #wipe { position: absolute; top: -300px; width: 700px; height: 2600px; left: -1300px; background: #ffd600;
        border-left: 14px solid #111; border-right: 14px solid #111; transform: rotate(14deg); }
      #flash { background: #fff; opacity: 0; }
      #redflash { background: #e3171b; opacity: 0; }
    </style>
  </head>
  <body>

              <circle cx="125" cy="160" r="12" fill="#111" />
              <text id="count" x="125" y="228" text-anchor="middle" font-family="ShivBlack" font-size="44" fill="#111">3</text>

    <script>
      // ===================== DATA (voice-time; cartoon OFF sec par shuru) =====================
      const OFF = 7.65;
      const END = 48.06;
      const CASE = "H09-001";
      // h = height px, w = width px (chaudi image), bottom = px from bottom
      const SCENES = [
        { img: "P_LIGHT_STAND_CUT", s: 0.0, e: 2.64, w: 960, bottom: 300, enter: "fade" },
        { img: "S08", s: 2.64, e: 5.51, h: 1000, bottom: 140, enter: "pop" },
        { img: "S12", s: 5.51, e: 8.2, h: 1000, bottom: 140, enter: "pop" },
        { img: "S10", s: 8.2, e: 10.53, h: 1000, bottom: 140, enter: "left" },
        { img: "G_V_MAN_CHECK_CUT", s: 10.53, e: 12.16, w: 980, bottom: 300, enter: "drop" },
        { img: "P_LIGHT_STAND_CUT", s: 12.16, e: 14.28, w: 960, bottom: 300, enter: "drop" },
        { img: "G_CIVIL_BLACK_CUT", s: 14.28, e: 20.76, h: 1000, bottom: 140, enter: "left" },
        { img: "G_M_LIGHTMAN_CUT", s: 20.76, e: 24.23, h: 1000, bottom: 140, enter: "right" },
        { img: "G_M_CAMERA_CUT", s: 24.23, e: 29.35, h: 1000, bottom: 140, enter: "left" },
        { img: "G_W_ORANGE_KURTI_CUT", s: 29.35, e: 35.52, h: 1000, bottom: 140, enter: "right", push: 1.06 },
        { img: "S02", s: 35.52, e: 38.52, h: 1000, bottom: 140, enter: "pop", push: 1.14 },
        { img: "S06", s: 38.52, e: 40.38, h: 1000, bottom: 140, enter: "pop" },
        { img: "CH09_001_OPTIONS", s: 40.38, e: 45.24, w: 960, bottom: 330, enter: "pop" },
        { img: "S16", s: 45.24, e: END, h: 1130, bottom: 0, enter: "rise", noexit: true },
      ];

      const P = [
        [["Kuch", 0.18, 0.22], ["log", 0.26, 0.45], ["sirf", 0.49, 0.78]],
        [["apne", 0.81, 0.97], ["naam", 1.01, 1.19], ["se", 1.27, 1.38]],
        [["VIRAL", 1.40, 1.64], ["ho", 1.68, 1.79], ["jaate", 1.83, 2.05], ["hain...", 2.07, 2.64]],
        [["...aur", 2.64, 2.71], ["kuch", 2.78, 3.08], ["apne", 3.26, 3.90]],
        [["naam", 3.94, 4.12], ["ke", 4.20, 4.31], ["peeche", 4.33, 4.57]],
        [["CHHUP", 4.64, 4.87], ["jaate", 4.90, 5.20], ["hain!", 5.22, 5.39]],
        [["Clue", 5.51, 5.99], ["isi", 6.06, 6.29], ["video", 6.33, 6.55], ["mein", 6.57, 6.67], ["hai.", 6.70, 7.27]],
        [["DHYAAN", 7.30, 7.57], ["se", 7.60, 7.71], ["dekhna.", 7.75, 8.09]],
        [["Shooting", 8.20, 8.88], ["ke", 8.92, 8.99], ["set", 9.01, 9.18], ["par", 9.23, 9.33]],
        [["shaam", 9.41, 9.63], ["chhe", 9.71, 9.86], ["baje", 9.93, 10.31]],
        [["producer", 10.53, 11.13], ["Sanjay", 11.20, 11.50]],
        [["MARE", 11.55, 11.73], ["mile.", 11.77, 12.03]],
        [["Light", 12.16, 12.70], ["stand", 12.74, 13.00], ["ki", 13.04, 13.15]],
        [["clamp", 13.19, 13.45], ["kholi", 13.49, 13.75], ["gayi", 13.80, 13.90], ["thi.", 13.97, 14.20]],
        [["Kabir", 14.28, 14.73], ["bola...", 14.80, 15.48]],
        [["\"Sanjay", 15.54, 15.86], ["mujhe", 15.89, 16.12]],
        [["nikalne", 16.14, 16.49], ["wala", 16.51, 16.68], ["tha,", 16.75, 16.90]],
        [["maanta", 16.96, 17.20], ["hoon!", 17.23, 17.42]],
        [["Par", 17.50, 17.88], ["chhe", 17.95, 18.10], ["baje", 18.15, 18.33], ["main", 18.36, 18.44]],
        [["interview", 18.46, 18.78], ["de", 18.81, 18.92], ["raha", 18.95, 19.11], ["tha,", 19.17, 19.60]],
        [["poora", 19.64, 19.90], ["record", 19.93, 20.20], ["hai.\"", 20.23, 20.76]],

        [["ho", 22.95, 23.03], ["gaya", 23.04, 23.14], ["tha,", 23.21, 23.51]],
        [["main", 23.55, 23.66], ["nikal", 23.70, 23.89], ["gaya.\"", 23.94, 24.19]],
        [["Raghav", 24.23, 24.93], ["bola...", 24.96, 25.21]],
        [["\"Set", 25.27, 25.81], ["ki", 25.84, 25.92], ["lightein", 25.94, 26.18]],
        [["saadhe", 26.25, 26.48], ["chhe", 26.51, 26.66], ["baje", 26.70, 26.85]],
        [["band", 26.89, 27.00], ["hui.", 27.04, 27.30]],
        [["Maine", 27.34, 27.81], ["usi", 27.86, 28.04], ["roshni", 28.07, 28.33], ["mein", 28.37, 28.48]],
        [["aakhri", 28.53, 28.78], ["shot", 28.82, 29.01], ["liya.\"", 29.05, 29.35]],
        [["Deepa", 29.35, 29.93], ["boli...", 29.97, 30.31]],
        [["\"Lightein", 30.34, 30.98], ["sirf", 31.05, 31.28]],
        [["light-man", 31.32, 31.65], ["Farhan", 31.69, 32.03], ["ki", 32.07, 32.18]],
        [["chaabi", 32.21, 32.44], ["se", 32.46, 32.55], ["band", 32.59, 32.70], ["hoti", 32.74, 32.96], ["hain.", 32.98, 33.23]],
        [["Aur", 33.24, 33.60], ["chaabi", 33.67, 33.97], ["wo", 34.01, 34.12]],
        [["kisi", 34.16, 34.42], ["ko", 34.46, 34.57], ["nahi", 34.60, 34.69], ["deta.\"", 34.71, 35.16]],
        [["Detective", 38.60, 38.86], ["Shivam", 38.94, 39.16], ["ne...", 39.20, 39.31]],
        [["KATIL", 39.35, 39.61], ["pakad", 39.69, 39.98], ["liya!", 40.02, 40.28]],
        [["Katil", 40.38, 40.84], ["kaun?", 40.84, 41.16]],
        [["COMMENT", 41.40, 41.82], ["karo.", 41.82, 42.12]],
        [["Aur", 42.12, 42.64], ["aisi", 42.64, 42.88], ["hi", 42.88, 43.00]],
        [["detective", 43.00, 43.40], ["stories", 43.40, 43.76], ["ke", 43.76, 44.05], ["liye", 44.05, 44.34]],
        [["FOLLOW", 44.34, 44.92], ["karo.", 44.92, 45.24]],
        [["Shivam", 45.24, 45.86], ["ki", 45.86, 45.98], ["nazar", 45.98, 46.32], ["se", 46.32, 46.80]],
        [["koi", 46.80, 47.24], ["nahi", 47.24, 47.50], ["bachta.", 47.50, 47.88]],
      ];

      const T = {
        hook: [0.1, 5.51],
        caseChip: [5.6, 8.1],
        chips: [["clock", "SHAAM 6 BAJE", 9.0, 10.5]],
        stamps: [["SAZISH!", 12.25, 14.2, -6]],
        crime: [10.55, 12.16],
        suspects: [["SUSPECT 1/4", "KABIR", 14.28, 20.76], ["SUSPECT 2/4", "FARHAN", 20.76, 24.23], ["SUSPECT 3/4", "RAGHAV", 24.23, 29.35], ["SUSPECT 4/4", "DEEPA", 29.35, 35.52]],
        dhyaan: null,
        soch: 35.52,
        solved: [39.35, 40.38],
        options: [40.38, 45.24, "1, 2, 3 ya 4?"],
        ctaPill: 41.4,
        brand: 45.3,
        night: [],
        black: [],
        relight: null,
      };
      // ===================== /DATA =====================

      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, html, parent, css) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html != null) e.innerHTML = html;
        if (css) Object.assign(e.style, css);
        if (parent) parent.appendChild(e);
        return e;
      };
      let seed = 7;
      const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };

      gsap.defaults({ immediateRender: false });
      const root = gsap.timeline({ paused: true });
      const tl = gsap.timeline();

      // hook clip -> 0.2s black -> cartoon
      root.fromTo("#story", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, OFF);

      tl.fromTo("#bg", { scale: 1 }, { scale: 1.12, duration: END, ease: "none" }, 0);

      // ---------- characters ----------
      SCENES.filter((s) => !s.skip).forEach((sc, i) => {
        const w = el("div", "char", null, $("chars"));
        w.style.bottom = sc.bottom + "px";
        w.style.transformOrigin = "50% 100%";
        const inner = el("div", "in", null, w);
        inner.style.transformOrigin = "50% 70%";
        const im = el("img", null, null, inner);
        im.src = "assets/" + sc.img + ".png";
        if (sc.w) im.style.width = sc.w + "px"; else im.style.height = sc.h + "px";
        const d = sc.e - sc.s;
        const enters = {
          none: [{ opacity: 1 }, { opacity: 1, duration: 0.01 }],
          fade: [{ opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }],
          pop: [{ opacity: 0, scale: 0.55, y: 60 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.8)" }],
          rise: [{ opacity: 0, y: 420 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }],
          drop: [{ opacity: 0, y: -160, rotation: -4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "bounce.out" }],
          left: [{ opacity: 0, x: -900, skewX: 14 }, { opacity: 1, x: 0, skewX: 0, duration: 0.42, ease: "power4.out" }],
          right: [{ opacity: 0, x: 900, skewX: -14 }, { opacity: 1, x: 0, skewX: 0, duration: 0.42, ease: "power4.out" }],
        };
        const [from, to] = enters[sc.enter];
        tl.fromTo(w, from, to, sc.s);
        if (sc.push) tl.fromTo(inner, { scale: 1 }, { scale: sc.push, duration: d, ease: "power1.inOut" }, sc.s);
        else tl.fromTo(inner, { y: 0 }, { y: -14, duration: d / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, sc.s);
        if (!sc.noexit) {
          const out = sc.enter === "left" ? { x: 900, skewX: -10 } : sc.enter === "right" ? { x: -900, skewX: 10 } : { scale: 0.8, y: 30 };
          tl.to(w, { opacity: 0, duration: 0.16, ease: "power2.in", ...out }, sc.e - 0.16);
        }
        if (i > 0) tl.fromTo("#cam", { scale: 1.06 }, { scale: 1, duration: 0.32, ease: "power2.out" }, sc.s);
      });

      // ---------- captions ----------
      P.forEach((ph, i) => {
        const box = el("div", "cap", null, $("caps"));
        const last = ph[ph.length - 1][2];
        const next = i + 1 < P.length ? P[i + 1][0][1] : END;
        const pEnd = Math.min(next, last + 0.7);
        ph.forEach(([txt, ws, we]) => {
          const w = el("span", "w", null, box);
          const wi = el("span", "wi", null, w);
          wi.textContent = txt;
          tl.fromTo(w, { opacity: 0, y: 26, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.14, ease: "back.out(2.5)" }, ws);
          if (/[A-Z]{2,}/.test(txt) && txt === txt.toUpperCase()) {
            tl.set(wi, { backgroundColor: "#ffd600", color: "#111111", webkitTextStrokeWidth: "0px" }, ws);
            tl.fromTo(wi, { scale: 1 }, { scale: 1.16, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, ws);
            tl.set(wi, { backgroundColor: "rgba(0,0,0,0)", color: "#ffd600", webkitTextStrokeWidth: "12px" }, Math.max(we, ws + 0.3));
          }
        });
        tl.to(box, { opacity: 0, y: -18, duration: 0.12, ease: "power1.in" }, pEnd - 0.12);
      });

      // ---------- header graphics ----------
      const hdr = () => el("div", "hdr", null, $("hdrs"));
      const stampIn = (node, t, rot) => {
        tl.fromTo(node, { opacity: 0, scale: 2.4, rotation: rot - 8 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.22, ease: "power4.in" }, t);
        tl.fromTo("#cam", { x: -14, y: 8 }, { x: 0, y: 0, duration: 0.25, ease: "elastic.out(1,0.3)" }, t + 0.22);
      };
      const fadeOut = (node, t) => tl.to(node, { opacity: 0, scale: 0.85, duration: 0.15, ease: "power2.in" }, t - 0.15);

      let n = el("div", "bigtitle", "KILLER KAUN?", hdr());
      stampIn(n, T.hook[0], -3);
      tl.to(n, { scale: 1.05, duration: 0.5, yoyo: true, repeat: 5, ease: "sine.inOut" }, T.hook[0] + 0.4);
      fadeOut(n, T.hook[1]);

      n = el("div", "chip", "CASE FILE #" + CASE, hdr());
      tl.fromTo(n, { opacity: 0, x: -500 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, T.caseChip[0]);
      fadeOut(n, T.caseChip[1]);

      const clockSvg =
        '<svg width="58" height="58" viewBox="0 0 58 58"><circle cx="29" cy="29" r="25" fill="none" stroke="#ffd600" stroke-width="6"/>' +
        '<line x1="29" y1="29" x2="29" y2="13" stroke="#ffd600" stroke-width="6" stroke-linecap="round"/>' +
        '<line x1="29" y1="29" x2="17" y2="29" stroke="#ffd600" stroke-width="6" stroke-linecap="round"/></svg>';
      T.chips.forEach(([icon, txt, s, e]) => {
        const c = el("div", "chip", (icon === "clock" ? clockSvg : "") + "<span>" + txt + "</span>", hdr());
        tl.fromTo(c, { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, s);
        fadeOut(c, e);
      });
      T.stamps.forEach(([txt, s, e, rot]) => {
        const st = el("div", "stamp", txt, hdr());
        stampIn(st, s, rot);
        fadeOut(st, e);
      });

      // ---------- crime scene: template B "Khoon ki Boondein" ----------
      {
        const [t0, t1] = T.crime;
        const fx = $("crime");
        const tag = el("div", "redtag", "CRIME SCENE", hdr());
        tl.fromTo(tag, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t0 + 0.05);
        fadeOut(tag, t1);
        const txt = "CRIME SCENE &#9679; DO NOT CROSS &#9679; ".repeat(4);
        const tp1 = el("div", "tape", txt, $("tapes"), { top: "770px" });
        const tp2 = el("div", "tape", txt, $("tapes"), { top: "1690px" });
        tl.fromTo(tp1, { opacity: 1, x: -1500, rotation: -9 }, { x: 0, rotation: -9, duration: 0.4, ease: "power3.out" }, t0 + 0.1);
        tl.fromTo(tp2, { opacity: 1, x: 1500, rotation: 7 }, { x: 0, rotation: 7, duration: 0.4, ease: "power3.out" }, t0 + 0.25);
        tl.to([tp1, tp2], { opacity: 0, duration: 0.15 }, t1 - 0.15);
        const grp = el("div", "layer", null, fx);
        const band = el("div", "mult", null, grp, { position: "absolute", left: 0, right: 0, top: 0, height: "0px", background: "#a50d14" });
        tl.to(band, { height: "70px", duration: 0.4, ease: "power2.out" }, t0 + 0.1);
        for (let i = 0; i < 11; i++) {
          const w = 26 + rnd() * 34;
          const d = el("div", "drip mult", null, grp, { left: Math.round(i * 100 + rnd() * 50) + "px", width: w + "px" });
          tl.to(d, { height: Math.round(500 + rnd() * 1500) + "px", duration: 1.4 + rnd() * 1.2, ease: "power1.in" }, t0 + 0.2 + rnd() * 0.5);
        }
        const curtain = el("div", "layer mult", null, grp, { background: "linear-gradient(180deg, #b3121a 0%, #b3121a 80%, rgba(179,18,26,0) 100%)", opacity: 0.6, clipPath: "inset(0 0 100% 0)" });
        tl.to(curtain, { clipPath: "inset(0 0 0% 0)", duration: 1.6, ease: "power1.inOut" }, t0 + 1.2);
        tl.to(grp, { opacity: 0, duration: 0.25 }, t1 - 0.2);
      }

      // suspects: badge + name plate (+ yellow wipe)
      T.suspects.forEach(([b, name, s, e], k) => {
        const dir = k % 2 ? 1 : -1;
        const bd = el("div", "badge", b, hdr());
        tl.fromTo(bd, { opacity: 0, y: -140, rotation: dir * 8 }, { opacity: 1, y: 0, rotation: dir * -2, duration: 0.45, ease: "back.out(2)" }, s + 0.1);
        fadeOut(bd, e);
        const np = el("div", "nameplate", null, $("hdrs"));
        const sp = el("span", null, name, np);
        tl.fromTo(sp, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, s + 0.3);
        fadeOut(sp, e);
        tl.fromTo("#wipe", { x: 0 }, { x: 2800, duration: 0.36, ease: "power2.inOut" }, s - 0.18);
      });

      if (T.dhyaan) {
        n = el("div", "badge", "DHYAAN DO!", hdr());
        tl.fromTo(n, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.5)" }, T.dhyaan[0]);
        tl.to(n, { scale: 1.1, duration: 0.3, yoyo: true, repeat: 7, ease: "sine.inOut" }, T.dhyaan[0] + 0.4);
        fadeOut(n, T.dhyaan[1]);
      }

      n = el("div", "stamp", "CASE SOLVED", hdr());
      n.style.fontSize = "84px";
      stampIn(n, T.solved[0], -7);
      fadeOut(n, T.solved[1]);

      n = el("div", "bigtitle", T.options[2], hdr());
      n.style.fontSize = "112px";
      stampIn(n, T.options[0] + 0.05, 0);
      fadeOut(n, T.options[1]);
      tl.fromTo("#cta span", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, T.ctaPill);
      tl.to("#cta span", { scale: 1.08, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, T.ctaPill + 0.4);
      tl.to("#cta span", { opacity: 0, duration: 0.15 }, T.options[1] - 0.15);

      n = el("div", null, null, hdr());
      n.id = "brand";
      n.innerHTML = '<img src="assets/LOGO_ROUND.png" alt="" /><span>@theshivamiq</span>';
      tl.fromTo(n, { opacity: 0, y: -80 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, T.brand);

      // ---------- night / blackout ----------
      T.night.forEach(([s, e, o]) => {
        tl.to("#night", { opacity: o, duration: 0.4 }, s);
        tl.to("#night", { opacity: 0, duration: 0.4 }, e - 0.4);
      });
      T.black.forEach(([s, e]) => {
        tl.to("#black", { opacity: 1, duration: 0.12, ease: "steps(3)" }, s);
        tl.to("#black", { opacity: 0, duration: 0.1 }, e);
      });
      if (T.relight != null) tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.5, ease: "power2.out" }, T.relight);

      // ---------- Shivam soch: stopwatch 3 sec ----------
      {
        const S = T.soch;
        const ticks = $("ticks");
        for (let k = 0; k < 12; k++) {
          const a = (k * 30 * Math.PI) / 180;
          const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
          ln.setAttribute("x1", 125 + Math.sin(a) * 96); ln.setAttribute("y1", 160 - Math.cos(a) * 96);
          ln.setAttribute("x2", 125 + Math.sin(a) * 84); ln.setAttribute("y2", 160 - Math.cos(a) * 84);
          ln.setAttribute("stroke", "#111"); ln.setAttribute("stroke-width", "5");
          ticks.appendChild(ln);
        }
        tl.fromTo("#watch", { opacity: 0, scale: 0.3, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2)" }, S);
        tl.fromTo("#ring", { attr: { "stroke-dashoffset": 553 } }, { attr: { "stroke-dashoffset": 0 }, duration: 3, ease: "none" }, S);
        gsap.set("#hand", { svgOrigin: "125 160" });
        for (let k = 1; k <= 15; k++) tl.to("#hand", { rotation: k * 24, duration: 0.05, ease: "power4.out" }, S + k * 0.2 - 0.05);
        tl.set("#count", { textContent: "3" }, S);
        tl.set("#count", { textContent: "2" }, S + 1);
        tl.set("#count", { textContent: "1" }, S + 2);
        for (const t of [S + 1, S + 2]) tl.fromTo("#watch", { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "power2.out" }, t);
        tl.to("#watch", { opacity: 0, scale: 0.6, duration: 0.15 }, S + 2.85);
        tl.to("#dimvig", { opacity: 1, duration: 0.4 }, S);
        tl.to("#dimvig", { opacity: 0, duration: 0.15 }, S + 2.85);
        const soch = $("sochtxt");
        "Shivam SOCH raha hai...".split("").forEach((c, k) => {
          if (c === " ") { soch.appendChild(document.createTextNode(" ")); return; }
          const sp = el("span", null, c, soch);
          tl.fromTo(sp, { opacity: 0 }, { opacity: 1, duration: 0.01 }, S + 0.58 + k * 0.045);
        });
        tl.to(soch, { opacity: 0, duration: 0.15 }, S + 2.85);
        tl.fromTo("#flash", { opacity: 0.9 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, S + 3);
      }

      root.add(tl, OFF);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = root;
    </script>
  </body>
</html>
