      if (C.cover > 0) {
        gsap.set("#coverimg", { display: "block" });
        root.to("#coverimg", { opacity: 0, duration: 0.12, ease: "power1.in" }, C.cover - 0.12);
        root.fromTo("#flash", { opacity: 0.8 }, { opacity: 0, duration: 0.3, ease: "power2.out" }, OFF);
      }
      root.fromTo("#story", { opacity: 0 }, { opacity: 1, duration: OFF > 0 ? 0.25 : 0.01, ease: "power1.out" }, OFF);

      tl.fromTo("#bg", { scale: 1 }, { scale: 1.12, duration: END, ease: "none" }, 0);

      // ---------- characters / images ----------
      // scene: {img, s, e, h|w, bottom, enter, x?, mirror?, push?, zoom?, shake?, noexit?, nopunch?}
      SCENES.filter((s) => !s.skip).forEach((sc, i) => {
        const w = el("div", "char", null, $("chars"));
        w.style.bottom = sc.bottom + "px";
        if (sc.x != null) { w.style.left = sc.x - 540 + "px"; w.style.right = 540 - sc.x + "px"; }
        w.style.transformOrigin = "50% 100%";
        const inner = el("div", "in", null, w);
        inner.style.transformOrigin = "50% 70%";
        const im = el("img", null, null, inner);
        im.src = "assets/" + sc.img + ".png";
        if (sc.w) im.style.width = sc.w + "px"; else im.style.height = sc.h + "px";
        if (sc.mirror) im.style.transform = "scaleX(-1)";
        const d = sc.e - sc.s;
        const enters = {
          none: [{ opacity: 1 }, { opacity: 1, duration: 0.01 }],
          fade: [{ opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: C.fade, ease: "power2.out" }],
          pop: [{ opacity: 0, scale: 0.55, y: 60 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.8)" }],
          popin: [{ opacity: 0, scale: 0 }, { opacity: 0.85, scale: C.pop.peak, duration: C.pop.t1, ease: "power2.out" }],
          rise: [{ opacity: 0, y: 420 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }],
          drop: [{ opacity: 0, y: -160, rotation: -4 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "bounce.out" }],
          left: [{ opacity: 0, x: -900, skewX: 14 }, { opacity: 1, x: 0, skewX: 0, duration: 0.42, ease: "power4.out" }],
          right: [{ opacity: 0, x: 900, skewX: -14 }, { opacity: 1, x: 0, skewX: 0, duration: 0.42, ease: "power4.out" }],
        };
        const [from, to] = enters[sc.enter] || enters.pop;
        tl.fromTo(w, from, to, sc.s);
        if (sc.enter === "popin") tl.to(w, { opacity: 1, scale: 1, duration: C.pop.t2 - C.pop.t1, ease: "power1.inOut" }, sc.s + C.pop.t1);
        (sc.zoom || []).forEach(([a, b]) => tl.fromTo(inner, { scale: 1 }, { scale: C.zoom, duration: b - a, ease: "none" }, a));
        (sc.shake || []).forEach((t) => {
          const n = 6, step = C.shake / n;
          for (let k = 0; k < n; k++)
            tl.to(inner, { x: k === n - 1 ? 0 : C.shakePx * (1 - k / n) * (k % 2 ? -1 : 1), duration: step, ease: "sine.inOut" }, t + k * step);
        });
        if (sc.push) tl.fromTo(inner, { scale: 1 }, { scale: sc.push, duration: d, ease: "power1.inOut" }, sc.s);
        else if (!(sc.zoom || []).length && C.floatPx)
          tl.fromTo(inner, { y: 0 }, { y: -C.floatPx, duration: d / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, sc.s);
        if (!sc.noexit && sc.e < END - 0.01) {
          const out = sc.enter === "left" ? { x: 900, skewX: -10 } : sc.enter === "right" ? { x: -900, skewX: 10 } : { scale: 0.8, y: 30 };
          tl.to(w, { opacity: 0, duration: 0.16, ease: "power2.in", ...out }, sc.e - 0.16);
        }
        if (i > 0 && !sc.nopunch && C.punch) tl.fromTo("#cam", { scale: C.punch }, { scale: 1, duration: 0.32, ease: "power2.out" }, sc.s);
      });

      // ---------- captions (word by word) ----------
      P.forEach((ph, i) => {
        const box = el("div", "cap", null, $("caps"));
        const last = ph[ph.length - 1][2];
        const next = i + 1 < P.length ? P[i + 1][0][1] : END;
        const pEnd = Math.min(next, last + 0.7);
        ph.forEach(([txt, ws, we]) => {
          const w = el("span", "w", null, box);
          const wi = el("span", "wi", null, w);
          wi.textContent = txt;
          tl.fromTo(w, { opacity: 0, y: 26, scale: 0.7 }, { opacity: 1, y: 0, scale: 1, duration: 0.14, ease: "back.out(2.5)" }, ws);
          if (/[A-Z]{2,}/.test(txt) && txt === txt.toUpperCase()) {
            tl.set(wi, { backgroundColor: "#ffd600", color: "#111111", webkitTextStrokeWidth: "0px" }, ws);
            tl.fromTo(wi, { scale: 1 }, { scale: 1.16, duration: 0.1, ease: "power2.out", yoyo: true, repeat: 1 }, ws);
            tl.set(wi, { backgroundColor: "rgba(0,0,0,0)", color: "#ffd600", webkitTextStrokeWidth: C.stroke + "px" }, Math.max(we, ws + 0.3));
          }
        });
        tl.to(box, { opacity: 0, y: -18, duration: 0.12, ease: "power1.in" }, pEnd - 0.12);
      });

      // ---------- header graphics ----------
      const hdr = () => el("div", "hdr", null, $("hdrs"));
      const stampIn = (node, t, rot) => {
        tl.fromTo(node, { opacity: 0, scale: 2.4, rotation: rot - 8 }, { opacity: 1, scale: 1, rotation: rot, duration: 0.22, ease: "power4.in" }, t);
        tl.fromTo("#cam", { x: -14, y: 8 }, { x: 0, y: 0, duration: 0.25, ease: "elastic.out(1,0.3)" }, t + 0.22);
      };
      const fadeOut = (node, t) => tl.to(node, { opacity: 0, scale: 0.85, duration: 0.15, ease: "power2.in" }, t - 0.15);
      let n;

      if (T.hook) {  // [s, e, "KILLER KAUN?"]
        n = el("div", "bigtitle", T.hook[2] || "KILLER KAUN?", hdr());
        stampIn(n, T.hook[0], -3);
        tl.to(n, { scale: 1.05, duration: 0.5, yoyo: true, repeat: 5, ease: "sine.inOut" }, T.hook[0] + 0.4);
        fadeOut(n, T.hook[1]);
      }
      if (T.caseChip) {
        n = el("div", "chip", "CASE FILE #" + CASE, hdr());
        tl.fromTo(n, { opacity: 0, x: -500 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, T.caseChip[0]);
        fadeOut(n, T.caseChip[1]);
      }

      const clockSvg =
        '<svg width="58" height="58" viewBox="0 0 58 58"><circle cx="29" cy="29" r="25" fill="none" stroke="#ffd600" stroke-width="6"/>' +
        '<line x1="29" y1="29" x2="29" y2="13" stroke="#ffd600" stroke-width="6" stroke-linecap="round"/>' +
        '<line x1="29" y1="29" x2="17" y2="29" stroke="#ffd600" stroke-width="6" stroke-linecap="round"/></svg>';
      T.chips.forEach(([icon, txt, s, e]) => {
        const c = el("div", "chip", (icon === "clock" ? clockSvg : "") + "<span>" + txt + "</span>", hdr());
        tl.fromTo(c, { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.35, ease: "back.out(2)" }, s);
        fadeOut(c, e);
      });
      T.stamps.forEach(([txt, s, e, rot]) => {
        const st = el("div", "stamp", txt, hdr());
        stampIn(st, s, rot);
        fadeOut(st, e);
      });

      // ---------- free text (Excel On-screen Text): [html, s, e, kind, yPx, sizePx] ----------
      // kind: hook | clue | twist | cta | plain
      T.texts.forEach(([html, s, e, kind, y, size]) => {
        const color = kind === "clue" ? C.colors.clue : kind === "twist" ? C.colors.twist : C.colors.normal;
        const node = el("div", "txt", html, $("texts"), { top: y + "px", fontSize: size + "px", color });
        gsap.set(node, { yPercent: -50 });
        if (kind === "hook" || kind === "twist") stampIn(node, s, -2);
        else tl.fromTo(node, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)" }, s);
        if (kind !== "plain") tl.to(node, { scale: 1.06, duration: 0.45, yoyo: true, repeat: 3, ease: "sine.inOut" }, s + 0.45);
        if (e < END - 0.01) fadeOut(node, e);
      });

      if (T.level) {  // [text, s, e]
        $("level").textContent = T.level[0];
        tl.fromTo("#level", { opacity: 0, x: -260 }, { opacity: 1, x: 0, duration: 0.4, ease: "back.out(1.8)" }, T.level[1]);
        if (T.level[2] < END - 0.01) tl.to("#level", { opacity: 0, duration: 0.2 }, T.level[2] - 0.2);
      }

      // ---------- crime scene: template B "Khoon ki Boondein" (sirf murder) ----------
      if (T.crime) {
        const [t0, t1] = T.crime;
        const fx = $("crime");
        const tag = el("div", "redtag", "CRIME SCENE", hdr());
        tl.fromTo(tag, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, t0 + 0.05);
        fadeOut(tag, t1);
        const txt = "CRIME SCENE &#9679; DO NOT CROSS &#9679; ".repeat(4);
        const tp1 = el("div", "tape", txt, $("tapes"), { top: "770px" });
        const tp2 = el("div", "tape", txt, $("tapes"), { top: "1690px" });
        tl.fromTo(tp1, { opacity: 1, x: -1500, rotation: -9 }, { x: 0, rotation: -9, duration: 0.4, ease: "power3.out" }, t0 + 0.1);
        tl.fromTo(tp2, { opacity: 1, x: 1500, rotation: 7 }, { x: 0, rotation: 7, duration: 0.4, ease: "power3.out" }, t0 + 0.25);
        tl.to([tp1, tp2], { opacity: 0, duration: 0.15 }, t1 - 0.15);
        const grp = el("div", "layer", null, fx);
        const band = el("div", "mult", null, grp, { position: "absolute", left: 0, right: 0, top: 0, height: "0px", background: "#a50d14" });
        tl.to(band, { height: "70px", duration: 0.4, ease: "power2.out" }, t0 + 0.1);
        for (let i = 0; i < 11; i++) {
          const w = 26 + rnd() * 34;
          const d = el("div", "drip mult", null, grp, { left: Math.round(i * 100 + rnd() * 50) + "px", width: w + "px" });
          tl.to(d, { height: Math.round(500 + rnd() * 1500) + "px", duration: 1.4 + rnd() * 1.2, ease: "power1.in" }, t0 + 0.2 + rnd() * 0.5);
        }
        const curtain = el("div", "layer mult", null, grp, { background: "linear-gradient(180deg, #b3121a 0%, #b3121a 80%, rgba(179,18,26,0) 100%)", opacity: 0.6, clipPath: "inset(0 0 100% 0)" });
        tl.to(curtain, { clipPath: "inset(0 0 0% 0)", duration: 1.6, ease: "power1.inOut" }, t0 + 1.2);
        tl.to(grp, { opacity: 0, duration: 0.25 }, t1 - 0.2);
      }

      // suspects: badge + name plate (+ yellow wipe)   [badge, name, s, e]
      T.suspects.forEach(([b, name, s, e], k) => {
        const dir = k % 2 ? 1 : -1;
        if (b) {
          const bd = el("div", "badge", b, hdr());
          tl.fromTo(bd, { opacity: 0, y: -140, rotation: dir * 8 }, { opacity: 1, y: 0, rotation: dir * -2, duration: 0.45, ease: "back.out(2)" }, s + 0.1);
          fadeOut(bd, e);
        }
        const np = el("div", "nameplate", null, $("hdrs"));
        const sp = el("span", null, name, np);
        tl.fromTo(sp, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.out" }, s + 0.3);
        fadeOut(sp, e);
        tl.fromTo("#wipe", { x: 0 }, { x: 2800, duration: 0.36, ease: "power2.inOut" }, s - 0.18);
      });

      if (T.dhyaan) {
        n = el("div", "badge", "DHYAAN DO!", hdr());
        tl.fromTo(n, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.5)" }, T.dhyaan[0]);
        tl.to(n, { scale: 1.1, duration: 0.3, yoyo: true, repeat: 7, ease: "sine.inOut" }, T.dhyaan[0] + 0.4);
        fadeOut(n, T.dhyaan[1]);
      }

      if (T.solved) {
        n = el("div", "stamp", "CASE SOLVED", hdr());
        n.style.fontSize = "84px";
        stampIn(n, T.solved[0], -7);
        fadeOut(n, T.solved[1]);
      }

      if (T.options) {
        n = el("div", "bigtitle", T.options[2], hdr());
        n.style.fontSize = "112px";
        stampIn(n, T.options[0] + 0.05, 0);
        fadeOut(n, T.options[1]);
      }
      if (T.ctaPill) {  // [s, e]
        $("cta").firstElementChild.textContent = C.ctaText;
        tl.fromTo("#cta span", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, T.ctaPill[0]);
        tl.to("#cta span", { scale: 1.08, duration: 0.35, yoyo: true, repeat: 1, ease: "sine.inOut" }, T.ctaPill[0] + 0.4);
        tl.to("#cta span", { opacity: 0, duration: 0.15 }, T.ctaPill[1] - 0.15);
      }

      if (T.brand != null) {
        n = el("div", null, null, hdr());
        n.id = "brand";
        n.innerHTML = '<img src="assets/LOGO_ROUND.png" alt="" /><span>@theshivamiq</span>';
        tl.fromTo(n, { opacity: 0, y: -80 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, T.brand);
      }

      // ---------- phone chat (optional): T.phone = {s, e, name, time, msgs:[[dir("out"/"in"), text, t]], top?, status?} ----------
      if (T.phone) {
        const ph = T.phone;
        const lay = el("div", "layer", null, null);
        $("cam").insertBefore(lay, $("black"));
        const body = el("div", "phone", null, lay, { top: (ph.top != null ? ph.top : 700) + "px" });
        const scr = el("div", "scr", null, body);
        el("div", "notch", null, scr);
        el("div", "sbar", "<span>" + (ph.time || "") + "</span><span>&#9679;&#9679;&#9679; 85%</span>", scr);
        const top = el("div", "top", null, scr);
        el("div", "av", (ph.name || "?").trim().charAt(0), top);
        el("div", null, '<div class="nm">' + (ph.name || "") + '</div><div class="st">' + (ph.status || "online") + "</div>", top);
        const box = el("div", "msgs", null, scr);
        el("div", "bar", "Message", scr);
        tl.fromTo(body, { opacity: 0, scale: 0.35, y: 260, rotation: -6 }, { opacity: 1, scale: 1, y: 0, rotation: 0, duration: 0.5, ease: "back.out(1.7)" }, ph.s);
        tl.fromTo(body, { rotation: 0 }, { rotation: 1.5, duration: (ph.e - ph.s - 0.6) / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, ph.s + 0.5);
        tl.to(body, { y: -C.floatPx, duration: (ph.e - ph.s - 0.6) / 2, ease: "sine.inOut", yoyo: true, repeat: 1 }, ph.s + 0.5);
        (ph.msgs || []).forEach(([dir, text, t]) => {
          const typ = dir === "out" ? el("div", "typ", "<i></i><i></i><i></i>", box) : null;
          const b = el("div", "bub " + (dir === "in" ? "in" : "out"), null, box);
          const words = String(text).split(" ");
          words.forEach((wd, k) => { el("span", "pw", wd, b); if (k < words.length - 1) b.appendChild(document.createTextNode(" ")); });
          el("span", "tm", (ph.time || "") + (dir === "out" ? " &#10003;&#10003;" : ""), b);
          gsap.set(b, { display: "none" });
          if (typ) {
            gsap.set(typ, { display: "none" });
            const t0 = Math.max(ph.s + 0.5, t - 0.9);
            tl.set(typ, { display: "flex" }, t0);
            tl.fromTo(typ, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.2, ease: "back.out(2)" }, t0);
            typ.querySelectorAll("i").forEach((d, k) =>
              tl.fromTo(d, { y: 0 }, { y: -10, duration: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, t0 + 0.1 + k * 0.1));
            tl.set(typ, { display: "none" }, t);
          }
          tl.set(b, { display: "block" }, t);
          tl.fromTo(b, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, t);
          b.querySelectorAll(".pw").forEach((s, k) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.05 }, t + 0.1 + k * 0.09));
        });
        if (ph.e < END - 0.01) tl.to(body, { opacity: 0, scale: 0.85, duration: 0.18, ease: "power2.in" }, ph.e - 0.18);
      }

      // ---------- night / blackout / overlays / pause ----------
      T.night.forEach(([s, e, o]) => {
        tl.to("#night", { opacity: o, duration: 0.4 }, s);
        tl.to("#night", { opacity: 0, duration: 0.4 }, e - 0.4);
      });
      T.black.forEach(([s, e]) => {
        tl.to("#black", { opacity: 1, duration: 0.12, ease: "steps(3)" }, s);
        tl.to("#black", { opacity: 0, duration: 0.1 }, e);
      });
      if (T.relight != null) tl.fromTo("#flash", { opacity: 0.85 }, { opacity: 0, duration: 0.5, ease: "power2.out" }, T.relight);
      T.overlays.forEach(([id, s, e, o]) => {  // night.png / fog.mp4 (element id)
        tl.to("#" + id, { opacity: o, duration: 0.4 }, s);
        tl.to("#" + id, { opacity: 0, duration: 0.4 }, Math.max(s + 0.4, e - 0.4));
      });
      T.pauses.forEach(([s, e]) => {
        tl.to("#dimvig", { opacity: 1, duration: 0.3 }, s);
        tl.to("#dimvig", { opacity: 0, duration: 0.15 }, e - 0.15);
      });

      // ---------- Shivam soch: stopwatch 3 sec ----------
      if (T.soch != null) {
        const S = T.soch;
        const ticks = $("ticks");
        for (let k = 0; k < 12; k++) {
          const a = (k * 30 * Math.PI) / 180;
          const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
          ln.setAttribute("x1", 125 + Math.sin(a) * 96); ln.setAttribute("y1", 160 - Math.cos(a) * 96);
          ln.setAttribute("x2", 125 + Math.sin(a) * 84); ln.setAttribute("y2", 160 - Math.cos(a) * 84);
          ln.setAttribute("stroke", "#111"); ln.setAttribute("stroke-width", "5");
          ticks.appendChild(ln);
        }
        tl.fromTo("#watch", { opacity: 0, scale: 0.3, rotation: -30 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.35, ease: "back.out(2)" }, S);
        tl.fromTo("#ring", { attr: { "stroke-dashoffset": 553 } }, { attr: { "stroke-dashoffset": 0 }, duration: 3, ease: "none" }, S);
        gsap.set("#hand", { svgOrigin: "125 160" });
        for (let k = 1; k <= 15; k++) tl.to("#hand", { rotation: k * 24, duration: 0.05, ease: "power4.out" }, S + k * 0.2 - 0.05);
        tl.set("#count", { textContent: "3" }, S);
        tl.set("#count", { textContent: "2" }, S + 1);
        tl.set("#count", { textContent: "1" }, S + 2);
        for (const t of [S + 1, S + 2]) tl.fromTo("#watch", { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "power2.out" }, t);
        tl.to("#watch", { opacity: 0, scale: 0.6, duration: 0.15 }, S + 2.85);
        tl.to("#dimvig", { opacity: 1, duration: 0.4 }, S);
        tl.to("#dimvig", { opacity: 0, duration: 0.15 }, S + 2.85);
        const soch = $("sochtxt");
        "Shivam SOCH raha hai...".split("").forEach((c, k) => {
          if (c === " ") { soch.appendChild(document.createTextNode(" ")); return; }
          const sp = el("span", null, c, soch);
          tl.fromTo(sp, { opacity: 0 }, { opacity: 1, duration: 0.01 }, S + 0.58 + k * 0.045);
        });
        tl.to(soch, { opacity: 0, duration: 0.15 }, S + 2.85);
        tl.fromTo("#flash", { opacity: 0.9 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, S + 3);
      }

      root.add(tl, OFF);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = root;
    </script>
  </body>
</html>
