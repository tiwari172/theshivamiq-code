<!doctype html>
<html><head><meta charset="UTF-8" />
<style>
  @font-face { font-family: "ShivBlack"; src: url("assets/fonts/MAIN.ttf"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "ShivBlack", sans-serif; }
  .abs { position: absolute; }
  #bg { inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
  #dark { inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(18,20,32,0.55) 0%, rgba(6,7,12,0.88) 60%, rgba(0,0,0,0.97) 100%); }
  .mini { width: 210px; height: 373px; padding: 5px; background: #f2efe6; opacity: 0.32; box-shadow: 0 10px 20px rgba(0,0,0,.6); }
  .mini img, #hero img { width: 100%; height: 100%; display: block; }
  #hero { left: 290px; top: 320px; width: 500px; height: 889px; padding: 12px; background: #f2efe6; transform: rotate(-4deg);
    box-shadow: 0 30px 60px rgba(0,0,0,.75); }
  .pin { width: 44px; height: 44px; border-radius: 50%; background: #e53935; border: 5px solid #7f0000; box-shadow: 0 6px 10px rgba(0,0,0,.5); }
  .t { left: 30px; right: 30px; text-align: center; -webkit-text-stroke: 14px #111; paint-order: stroke fill; line-height: 1.02; }
</style></head>
<body>
  <img id="bg" class="abs" src="assets/BG_MAIN.png" />
  <div id="dark" class="abs"></div>
  <div class="abs mini" style="left:-40px;top:300px;transform:rotate(-6deg)"><img src="assets/cover_02.png" /></div>

  <div class="abs mini" style="left:890px;top:930px;transform:rotate(-5deg)"><img src="assets/cover_09.png" /></div>
  <div id="hero" class="abs"><img src="assets/cover_01.png" />
    <div class="abs pin" style="left:228px;top:-14px"></div>
    <svg class="abs" style="left:87px;top:86px" width="330" height="130" viewBox="0 0 660 260">
      <path d="M 70 150 C 60 70, 230 40, 330 42 C 470 44, 600 70, 594 132 C 588 196, 470 222, 330 220 C 190 218, 50 196, 58 130 C 64 90, 140 66, 240 58"
        fill="none" stroke="#E53935" stroke-width="22" stroke-linecap="round" transform="rotate(-5 330 130)" /></svg>

  <div class="abs t" style="top:1620px;font-size:84px;color:#FFD400;-webkit-text-stroke:12px #111">SOMWAR SE<br>HARD CASES</div>
</body></html>
