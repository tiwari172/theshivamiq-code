<!doctype html>
<html><head><meta charset="UTF-8" />
<style>
  @font-face { font-family: "ShivBlack"; src: url("assets/fonts/MAIN.ttf"); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "ShivBlack", sans-serif; }
  .abs { position: absolute; }

  .t { left: 30px; right: 30px; text-align: center; -webkit-text-stroke: 14px #111; paint-order: stroke fill; line-height: 1.02; }
  .pill { font-size: 54px; color: #111; background: #F5C542; border: 6px solid #111; border-radius: 40px; padding: 6px 28px 12px; box-shadow: 0 8px 0 #111; }
  .coin { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3b0, #F5C542 45%, #a67c00);
    border: 6px solid #7a5a00; color: #7a5a00; font-size: 66px; text-align: center; line-height: 106px; }
</style></head>
